[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.1.0"
description = "FORGE, a terminal AI harness engine for coding-agent workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Devanadhan" },
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "rich>=13.0,<14",
]
keywords = ["ai", "agent", "cli", "coding-agent", "harness", "llm", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Devakesavan/Forge-Engine"
Repository = "https://github.com/Devakesavan/Forge-Engine"
BugTracker = "https://github.com/Devakesavan/Forge-Engine/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge", "harness"]
